name: CI

# Server CI runs when dev has been merged into main. Feature, fix and hotfix
# branches are checked locally before they reach dev (npm run ci:local, run by
# .githooks/pre-push). See CONTRIBUTING.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Release script rules
        run: npm run test:release

      - name: Build
        run: npm run build

  consumer-smoke:
    name: Consumer smoke (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack, install into a clean project, typecheck the public import
        run: bash scripts/consumer-smoke.sh ${{ matrix.react }}

  # Off until the tracked secrets are cleaned up and an allowlist is agreed.
  # Enable it by setting the repository variable SECRET_SCAN to "true".
  secret-scan:
    name: Secret scan (gitleaks)
    if: vars.SECRET_SCAN == 'true'
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan the tree
        run: gitleaks dir --redact --no-banner --exit-code 1 .
