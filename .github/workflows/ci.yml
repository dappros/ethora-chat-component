name: CI

# Server CI runs when dev has been merged into main. Feature, fix and hotfix
# branches are checked locally before they reach dev (npm run ci:local, run by
# .githooks/pre-push). See CONTRIBUTING.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Release script rules
        run: npm run test:release

      - name: Build
        run: npm run build
