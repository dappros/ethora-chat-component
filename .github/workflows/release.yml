name: Release

# Publishes @ethora/chat-component to npm.
#
# Two ways in:
#   - Push a tag vYY.M.D on main (npm run release -- --yes --push does this locally).
#     Only the publish job runs.
#   - Run this workflow by hand (Actions > Release > Run workflow). The tag job
#     bumps and tags main, then publish releases that tag in the same run.
#
# Verification (lint, tests, build, consumer smoke test) is not repeated here.
# The CI workflow runs it on every push to main, and the tag is made from main.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'yy.m.d without leading zeros. Empty = the day after the current version (26.10.1 becomes 26.10.2).'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Manual runs only. A tag pushed with GITHUB_TOKEN does not start other
  # workflows, so the publish job lives in this file and runs after this job.
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump, commit, tag and push
        id: bump
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$REQUESTED" ]; then
            node scripts/release.mjs --yes --push "$REQUESTED"
          else
            node scripts/release.mjs --yes --push
          fi
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    # Runs after a successful tag job (manual runs) or when it was skipped
    # (tag-push runs, where github.ref_name is the tag).
    if: ${{ always() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Optional approval gate. Create the environment in repo settings with
    # required reviewers to approve every publish.
    environment: npm-release
    steps:
      - name: Resolve tag
        id: resolve
        env:
          TAG_INPUT: ${{ needs.tag.outputs.tag || github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG_INPUT" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag '$TAG_INPUT' does not match ^v[0-9]+\.[0-9]+\.[0-9]+$. Nothing was published." >&2
            exit 1
          fi
          echo "tag=$TAG_INPUT" >> "$GITHUB_OUTPUT"

      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC) needs npm 11.5.1 or newer.
      - name: Use npm 11 for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Check package.json version matches the tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::package.json is $version but the tag is $TAG. Nothing was published." >&2
            exit 1
          fi

      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
